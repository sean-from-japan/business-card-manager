{% extends "base.html" %}
{% block content %}
<h1>パスワードの再設定</h1>
<form method="post" class="box" style="max-width:420px">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <p>登録したメールアドレスを入力してください。再設定用のリンクを送ります。リンクの有効期限は30分です。</p>
  <div class="field"><label for="email">メールアドレス</label><input id="email" type="email" name="email" required autofocus></div>
  <button>リンクを送る</button>
  <p class="muted"><a href="{{ url_for('login') }}">ログイン画面に戻る</a></p>
</form>
{% endblock %}
