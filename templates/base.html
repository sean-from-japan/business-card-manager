<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}名刺管理{% endblock %}</title>
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#f6f8fa; --accent:#0b5cad; --err:#b42318; --warn:#9a6700; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color:var(--fg); background:#fff; }
  header { display:flex; gap:16px; align-items:center; padding:10px 24px; border-bottom:1px solid var(--line); background:var(--bg); }
  header .brand { font-weight:700; margin-right:auto; }
  header a { color:var(--accent); text-decoration:none; }
  header form { margin:0; }
  main { max-width:1100px; margin:24px auto; padding:0 24px; }
  h1 { font-size:1.4rem; }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; }
  th { background:var(--bg); font-weight:600; }
  input[type=text], input[type=email], input[type=password], input[type=search], select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:1rem; width:100%; }
  button, .btn { padding:6px 14px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; font-size:.95rem; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary, .btn.secondary { background:#fff; color:var(--accent); }
  button.danger { background:#fff; color:var(--err); border-color:var(--err); }
  .flash { padding:10px 14px; border-radius:6px; margin-bottom:12px; }
  .flash.error { background:#fdecea; color:var(--err); }
  .flash.info { background:#e8f2fc; color:var(--accent); }
  .warn { color:var(--warn); }
  .muted { color:var(--muted); font-size:.9rem; }
  .two { display:grid; grid-template-columns: 1fr 1fr; gap:24px; align-items:start; }
  .card-img { max-width:100%; border:1px solid var(--line); border-radius:6px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-weight:600; margin-bottom:4px; }
  .field.unclear input { border-color:var(--warn); background:#fff8e6; }
  .row { display:flex; gap:8px; align-items:center; }
  .box { border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
  /* Smartphone layout: wrap header, scroll wide tables, touch-sized controls */
  @media (max-width: 639px) {
    header { flex-wrap:wrap; gap:8px 12px; padding:8px 12px; }
    main { padding:0 12px; margin:12px auto; }
    table { display:block; overflow-x:auto; }
    button, .btn, input[type=text], input[type=email], input[type=password], input[type=search], input[type=file], select { min-height:44px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">名刺管理</span>
  {% if user %}
    <a href="{{ url_for('cards') }}">名刺一覧</a>
    <a href="{{ url_for('card_new') }}">名刺を取り込む</a>
    {% if user.role == 'admin' %}<a href="{{ url_for('admin_users') }}">利用者と閲覧許可</a>{% endif %}
    <a href="{{ url_for('change_password') }}" class="muted">{{ user.email }}（{{ user.role }}）</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="secondary">ログアウト</button></form>
  {% endif %}
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
