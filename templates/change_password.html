{% extends "base.html" %}
{% block content %}
<h1>パスワードの変更</h1>
{% if user.must_change_password %}<p>管理者が発行したパスワードでログインしました。続けるには、自分だけが知るパスワードに変更してください。</p>{% endif %}
<form method="post" class="box" style="max-width:420px">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="field"><label for="current">今のパスワード</label><input id="current" type="password" name="current" required autocomplete="current-password"></div>
  <div class="field"><label for="new">新しいパスワード（8文字以上）</label><input id="new" type="password" name="new" minlength="8" required autocomplete="new-password"></div>
  <div class="field"><label for="confirm">新しいパスワード（確認）</label><input id="confirm" type="password" name="confirm" minlength="8" required autocomplete="new-password"></div>
  <button>変更</button>
</form>
{% endblock %}
